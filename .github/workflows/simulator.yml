# The verification loop this project did not have.
#
# The app was written on Linux and never executed. It compiles, and 206
# Foundation-only wire checks pass, and neither of those can tell you whether a
# fling decelerates like a fling. This boots a simulator, drives the app through
# every piece of motion it has, records the screen, and measures the interval
# between the frames that actually reached it.
#
# Free tier only: `macos-latest` on a public repository is unmetered. Nothing
# here needs a paid runner, a signing identity, or an Apple ID.

name: simulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keyed on the commit, not the branch. Branch-keyed with cancel-in-progress
# meant every push from a peer session working in this repo killed the run that
# was mid-flight -- three runs died that way having never reached the simulator,
# which reads exactly like a build failure and is not one.
concurrency:
  group: simulator-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # The Foundation-only checks, kept green. They run on macOS here rather than
  # Linux, which also proves the decode contract is not Linux-Foundation-shaped.
  wiretest:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Wire checks
        run: bash app/wiretest/run.sh

  drive:
    runs-on: macos-latest
    timeout-minutes: 60
    # Needed by "Publish the filmstrip": the job pushes frames to a branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -x
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      # SwiftPM cannot emit an iOS .app -- Package.swift declares a library and
      # the device build wraps it with xtool. ci/project.yml rebuilds the same
      # sources as an application plus a UI-test bundle. It points at
      # app/HotlineCall/Sources/HotlineCall directly, so there is no second copy
      # of the source list to drift.
      - name: Generate the Xcode project
        run: |
          set -euxo pipefail
          cd ci
          xcodegen generate --spec project.yml
          xcodebuild -list -project HotlineCall.xcodeproj

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          # Whatever iPhone this image actually has, newest first. Hardcoding
          # "iPhone 16" is how this job breaks silently when the image rolls.
          UDID=$(python3 ci/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"

      - name: Start the stub daemon
        run: |
          set -euo pipefail
          nohup python3 ci/stub/daemon.py 8789 > stub.log 2>&1 &
          echo $! > stub.pid
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://127.0.0.1:8789/health >/dev/null; then
              echo "stub is up"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8789/health | head -c 400; echo
          # The simulator shares the host's network stack, so 127.0.0.1 inside
          # the simulator is this loopback. Prove it rather than assume it.
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" \
            /usr/bin/curl -sf --max-time 5 http://127.0.0.1:8789/health >/dev/null \
            && echo "reachable from inside the simulator" \
            || echo "WARNING: simctl spawn curl could not reach the stub (the app may still)"

      # Split from the test run so the recorder is not filming a compile.
      - name: Build for testing
        run: |
          set -euxo pipefail
          cd ci
          xcodebuild build-for-testing \
            -project HotlineCall.xcodeproj \
            -scheme HotlineCall \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ../DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee ../build.log | grep -E "error:|warning:|BUILD|Compiling|Linking" || true
          # tee swallows xcodebuild's status; check it explicitly.
          grep -q "BUILD SUCCEEDED" ../build.log

      - name: Drive it, and film it
        id: drive
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p out

          xcrun simctl io "$UDID" recordVideo --codec h264 --force out/drive.mp4 &
          REC=$!
          echo "recorder pid $REC"
          sleep 2

          # **Stills as well as video, and not as a duplicate of it.** The mp4
          # is 110 MB, which is fine as an artifact and useless to anything that
          # cannot download artifacts -- see the publish step below for why that
          # matters here. A 2 s filmstrip is small enough to commit.
          mkdir -p out/shots
          ( i=0
            while :; do
              i=$((i + 1))
              xcrun simctl io "$UDID" screenshot --type=png \
                "out/shots/$(printf %03d "$i").png" >/dev/null 2>&1 || true
              sleep 2
            done ) &
          SHOTS=$!
          echo "filmstrip pid $SHOTS"

          set -o pipefail
          cd ci
          xcodebuild test-without-building \
            -project HotlineCall.xcodeproj \
            -scheme HotlineCall \
            -destination "id=$UDID" \
            -derivedDataPath ../DerivedData \
            -resultBundlePath ../out/drive.xcresult \
            -only-testing:HotlineCallUITests/DriveTests/testLaunches \
            -only-testing:HotlineCallUITests/DriveTests/testDrive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../out/test.log
          STATUS=${PIPESTATUS[0]}
          cd ..

          # SIGINT is what finalises the mp4 -- SIGKILL leaves an unplayable file.
          kill -INT "$REC" 2>/dev/null || true
          for i in $(seq 1 20); do kill -0 "$REC" 2>/dev/null || break; sleep 1; done
          kill -9 "$REC" 2>/dev/null || true
          kill "$SHOTS" 2>/dev/null || true
          sleep 1
          echo "filmstrip frames: $(ls out/shots/*.png 2>/dev/null | wc -l)"
          ls -la out/
          # Say plainly whether the recorder produced anything. Run
          # 32923724565 went green having created no drive-video artifact at
          # all -- `if-no-files-found: warn` turns "we filmed nothing" into a
          # line nobody reads, which is exactly the silent green this CI exists
          # to stop. The recording stays best-effort; being quiet about it does
          # not.
          if [ -s out/drive.mp4 ]; then
            echo "RECORDING $(stat -f%z out/drive.mp4) bytes"
          else
            echo "RECORDING NONE -- simctl io recordVideo produced no file"
            echo "> \`simctl io recordVideo\` produced no file on this run." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "--- the drive's own markers ---"
          grep -E "^MARK " out/test.log || echo "(no MARK lines -- the drive never started)"
          exit "$STATUS"

      # Attempted separately and never allowed to fail the job: the app's list
      # is not UIScrollView-backed, so the OS scroll signposts these metrics key
      # off may never fire. Whether they do is a finding either way.
      - name: Apple's own metrics (best effort)
        if: always()
        continue-on-error: true
        run: |
          set -uxo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          cd ci
          xcodebuild test-without-building \
            -project HotlineCall.xcodeproj \
            -scheme HotlineCall \
            -destination "id=$UDID" \
            -derivedDataPath ../DerivedData \
            -resultBundlePath ../out/metrics.xcresult \
            -only-testing:HotlineCallUITests/DriveTests/testLaunchMetric \
            -only-testing:HotlineCallUITests/DriveTests/testScrollHitchMetric \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../out/metrics.log
          cd ..
          echo "--- measured values ---"
          grep -E "measured|Time|hitch|average" out/metrics.log | head -60 || true

      # The drive's number means nothing on its own. This films Apple's own
      # Settings app through the same recorder, on the same runner, with the
      # same gestures, so "19% of frames dropped" can be read as either the app
      # or the machine instead of being assumed to be the app.
      - name: Film the control, so the drive has a baseline
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p out

          # The drive's recorder can still own the device. SIGINT is what
          # finalises an mp4, and the drive step follows it with SIGKILL after
          # 20s -- a killed recorder leaves the simulator's host recording
          # session open, and the next recordVideo is refused outright:
          #   Error Domain=NSPOSIXErrorDomain Code=16 "Resource busy"
          #   Host recording is already in progress
          # That is exactly how run 33012440901 ran the whole control drive and
          # filmed none of it, so wait for the device to let go, then check the
          # recorder actually took rather than assuming it did.
          pkill -INT -f 'simctl io .* recordVideo' 2>/dev/null || true
          for _ in $(seq 1 20); do
            pgrep -f 'simctl io .* recordVideo' >/dev/null 2>&1 || break
            sleep 1
          done

          REC=""
          for attempt in 1 2 3; do
            : > out/control-rec.log
            xcrun simctl io "$UDID" recordVideo --codec h264 --force out/control.mp4 \
              >out/control-rec.log 2>&1 &
            CANDIDATE=$!
            sleep 4
            if kill -0 "$CANDIDATE" 2>/dev/null \
               && ! grep -qi "already in progress\|Resource busy" out/control-rec.log; then
              REC="$CANDIDATE"
              echo "control recorder started on attempt $attempt (pid $REC)"
              break
            fi
            echo "control recorder attempt $attempt did not take:"
            cat out/control-rec.log || true
            kill -9 "$CANDIDATE" 2>/dev/null || true
            sleep 5
          done
          [ -n "$REC" ] || echo "control recorder never started -- no baseline this run"

          cd ci
          xcodebuild test-without-building \
            -project HotlineCall.xcodeproj \
            -scheme HotlineCall \
            -destination "id=$UDID" \
            -derivedDataPath ../DerivedData \
            -resultBundlePath ../out/control.xcresult \
            -only-testing:HotlineCallUITests/DriveTests/testRunnerFloor \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../out/control.log
          cd ..

          # SIGINT is what finalises the mp4; SIGKILL leaves it unplayable.
          if [ -n "$REC" ]; then
            kill -INT "$REC" 2>/dev/null || true
            for i in $(seq 1 20); do kill -0 "$REC" 2>/dev/null || break; sleep 1; done
            kill -9 "$REC" 2>/dev/null || true
          fi
          sleep 1

          if [ -s out/control.mp4 ]; then
            echo "CONTROL RECORDING $(stat -f%z out/control.mp4) bytes"
          else
            echo "CONTROL RECORDING NONE -- no baseline this run"
          fi
          grep -E "^MARK " out/control.log || echo "(no MARK lines -- the control never ran)"

      - name: Frame timings from the recording
        if: always()
        run: |
          set -uo pipefail
          if [ ! -s out/drive.mp4 ]; then
            echo "no video was produced -- nothing to measure"
            exit 0
          fi
          # Guards the metric itself: a flawless 60fps stream carrying the
          # recorder's own timestamp jitter must score clean, and a real 30fps
          # stream must not. Both directions, because the bug this replaced
          # only failed in one of them.
          python3 ci/frametimes.py --self-test

          # Control first: the app's number is judged against the floor this
          # machine actually has, so the floor has to be measured before the
          # app is scored. Emitting the app's summary before that re-score is
          # how run 33015245379 printed `verdict: hitchy` directly above a line
          # reading "at or below the floor" -- one report contradicting itself
          # is how the original misreading happened in the first place.
          if [ -s out/control.mp4 ]; then
            python3 ci/frametimes.py out/control.mp4 --json out/control-frametimes.json \
              | tee out/control-frametimes.txt
            CTL=$(python3 -c "import json;print(json.load(open('out/control-frametimes.json'))['dropped_frame_pct'])")
            python3 ci/frametimes.py out/drive.mp4 --json out/frametimes.json \
              --baseline-pct "$CTL" | tee out/frametimes.txt
          else
            CTL=""
            python3 ci/frametimes.py out/drive.mp4 --json out/frametimes.json | tee out/frametimes.txt
          fi

          APP=$(python3 -c "import json;print(json.load(open('out/frametimes.json'))['dropped_frame_pct'])")
          VERDICT=$(python3 -c "import json;print(json.load(open('out/frametimes.json'))['verdict'])")

          {
            echo "## Frame timings"
            echo
            echo "Measured from the simulator recording's own sample table -- the"
            echo "interval between frames that actually reached the screen."
            echo "Idle gaps are reported separately rather than scored, and only"
            echo "intervals past 1.5 budgets count, so capture jitter cannot"
            echo "masquerade as a dropped frame."
            echo
            echo "### The app"
            echo '```json'
            cat out/frametimes.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$CTL" ]; then
            {
              echo "### The control (Apple's Settings, same runner, same gestures)"
              echo '```json'
              cat out/control-frametimes.json
              echo '```'
              echo
              echo "**App ${APP}% dropped vs control ${CTL}% dropped — ${VERDICT}.**"
              echo
              echo "Settings is UIScrollView-backed and smooth on real hardware,"
              echo "so what it drops here is the runner's software rasteriser."
              echo "An app at or below that floor cannot be convicted by this"
              echo "measurement -- which is not the same as being smooth on a"
              echo "real phone, and this instrument cannot speak to that."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "--- app ${APP}% dropped vs control ${CTL}% dropped -- ${VERDICT} ---"
          else
            echo "no control recording -- the app's number has no baseline this run" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: What the run saw
        if: always()
        run: |
          {
            echo "## The drive"
            echo
            echo '```'
            grep -E "^MARK " out/test.log 2>/dev/null || echo "(none)"
            echo '```'
            echo
            echo "## Stub daemon"
            echo '```'
            head -20 stub.log 2>/dev/null || echo "(none)"
            echo "..."
            grep -c "POST" stub.log 2>/dev/null | sed 's/^/POST requests served: /' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          kill "$(cat stub.pid)" 2>/dev/null || true

      # Belt and braces beside the in-test attachments: this one catches the
      # state after the harness has let go, which `XCUIScreen` cannot.
      - name: Screenshot the final state
        if: always()
        run: |
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot out/final.png || true
          if [ -s out/final.png ]; then
            echo "FINAL FRAME $(stat -f%z out/final.png) bytes"
          else
            echo "FINAL FRAME NONE -- simctl io screenshot produced no file"
          fi

      # **The only route by which the machine that writes this app can see it
      # running.** Artifact download requires a GitHub token; the one on the
      # workstation is expired and `gh auth login` needs a browser nobody is
      # sitting at. `git` over SSH does work there, so CI pushes the frames to
      # an orphan branch and the workstation fetches them.
      #
      # Force-pushed with no history on purpose: this branch is a window, not a
      # record, and it must not grow without bound. Delete it and nothing is
      # lost -- the same frames are in the artifacts for anyone who can reach
      # them.
      - name: Publish the filmstrip so a Linux box can look at it
        if: always()
        run: |
          set -uo pipefail
          shopt -s nullglob
          frames=(out/shots/*.png)
          if [ -s out/final.png ]; then frames+=(out/final.png); fi
          if [ ${#frames[@]} -eq 0 ]; then
            echo "no frames to publish"
            exit 0
          fi

          mkdir -p publish
          for f in "${frames[@]}"; do
            cp "$f" "publish/$(basename "$f")"
            # `sips` ships with macOS. 420 px wide keeps a phone screenshot
            # readable at roughly 60 KB rather than 1.5 MB.
            sips --resampleWidth 420 "publish/$(basename "$f")" >/dev/null 2>&1 || true
          done
          {
            echo "commit ${{ github.sha }}"
            echo "run    ${{ github.run_id }}"
            echo "frames ${#frames[@]}"
            echo
            grep -E "^MARK " out/test.log 2>/dev/null || echo "(no MARK lines)"
            echo
            grep -E "^PROSE |^VIEW " out/test.log 2>/dev/null || echo "(no PROSE/VIEW lines -- the checks did not run)"
            echo
            echo "-- the chip in the tree --"
            grep -E "view-chip|route-chip|more-chip" out/test.log 2>/dev/null | head -10 || echo "(not in any dumped tree)"
            echo
            # A compile error is otherwise only in the step log and the
            # build.log artifact, and both need a GitHub token. Run
            # 33094103028 failed to build and the one machine that could fix
            # it could not read why.
            echo "-- build errors, if any --"
            grep -E "error:" build.log 2>/dev/null | head -20 || echo "(none)"
            echo
            # Run 33111035204 died mid-drive and the reason was only in the
            # step log and the test.log artifact, both behind a token this
            # machine does not have -- the same blindness the build errors
            # above were added to fix, one layer along.
            echo "-- test failures, if any --"
            grep -E "error:|Fatal error|failed \\(|unexpected exit|test timeout|Restarting after" \
                out/test.log 2>/dev/null | head -20 || echo "(none)"
          } > publish/RUN.txt

          cd publish
          git init -q
          git checkout -q -b ci-shots
          git config user.email "ci@hotline.local"
          git config user.name "hotline ci"
          git add -A
          git commit -q -m "filmstrip for ${{ github.sha }} (run ${{ github.run_id }})"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            ci-shots
          echo "published $(ls *.png | wc -l) frames to the ci-shots branch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-video
          path: |
            out/drive.mp4
            out/control.mp4
            out/final.png
            out/frametimes.json
            out/frametimes.txt
            out/control-frametimes.json
            out/control-frametimes.txt
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-logs
          path: |
            out/test.log
            out/metrics.log
            build.log
            stub.log
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-xcresult
          path: |
            out/drive.xcresult
            out/metrics.xcresult
          retention-days: 14
          if-no-files-found: warn
