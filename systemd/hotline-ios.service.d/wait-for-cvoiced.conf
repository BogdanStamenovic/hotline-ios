[Service]
# Bounded, always-exit-0 wait so the voice leg is up before build_voice()
# probes cvoiced exactly once. TimeoutStartSec is raised above the wait's
# own deadline: with both at 90 s, systemd killed the start job mid-wait and
# hotline-ios restart-looped with no doorbell at all (2026-09-11 08:00-08:07).
ExecStartPre=-/home/bodas/.claude/bin/wait-for-cvoiced 60
TimeoutStartSec=180
