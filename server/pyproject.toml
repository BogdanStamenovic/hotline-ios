[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotline-ios"
version = "0.1.0"
description = "Real ringing calls from a Claude Code session to an iPhone"
readme = "../README.md"
# Matches hotline's floor for the same reasons -- this process imports hotline's
# audio stack in-process, so it has to live in the same interpreter it does.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
dependencies = []

[project.optional-dependencies]
# The ring transports. Each is optional so that a box only needs the deps for
# the outcome it is actually running -- see docs/ARCHITECTURE.md.
# The doorbell he chose. A user account, not a bot: MTProto's phone.requestCall
# is user-only, so a bot token cannot place a call.
telegram = ["telethon>=1.44"]
dev = [
  "pytest>=8.0,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
]

[project.scripts]
hotline-call = "hotline_ios.call_cli:main"
hotline-iosd = "hotline_ios.daemon:main"
hotline-ios-hooks = "hotline_ios.hooks:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hotline_ios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
# hotline is imported over PYTHONPATH rather than installed here, and type
# checking someone else's package is not this package's job. Everything crossing
# that boundary is narrowed immediately -- a reply's .text, an Agent's fields --
# so there is nothing to check across it. Same shape as hotline's own overrides
# for faster-whisper and piper.
[[tool.mypy.overrides]]
module = ["hotline.*"]
ignore_missing_imports = true

# telethon ships no type information. Everything it returns is immediately
# narrowed to a call id or an exception here, so there is nothing to check
# across the boundary -- same reasoning as hotline's overrides for faster-whisper.
[[tool.mypy.overrides]]
module = ["telethon.*"]
ignore_missing_imports = true
