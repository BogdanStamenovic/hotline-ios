[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotline-ios"
version = "0.1.0"
description = "The server the hotline iPhone app talks to: agent roster, channels, control and delegation"
# No `readme`: the README is the repository's, one level up, and hatchling
# refuses a readme outside the project directory -- which is why an editable
# install of this package used to fail and hotline-call's shim carried a
# module-form fallback.
# Matches hotline's floor: this process imports hotline's registry, router and
# HTTP server in-process.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
dependencies = []

[project.optional-dependencies]
# Phone calls -- the ring, the voice, Whisper, Telegram -- moved to hotline-call
# on 2026-10-31, and their dependencies went with them.
#
# What hotline itself needs to be imported over PYTHONPATH: its package
# __init__ pulls in phoneauth, which imports nacl, and hotline's own pyproject
# does not declare it.
hotline = ["pynacl>=1.5"]
dev = [
  "pytest>=8.0,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
]

[project.scripts]
hotline-iosd = "hotline_ios.daemon:main"
hotline-ios-hooks = "hotline_ios.hooks:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hotline_ios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
# hotline is imported over PYTHONPATH rather than installed here, and type
# checking someone else's package is not this package's job. Everything crossing
# that boundary is narrowed immediately -- a reply's .text, an Agent's fields --
# so there is nothing to check across it. Same shape as hotline's own overrides
# for faster-whisper and piper.
[[tool.mypy.overrides]]
module = ["hotline.*"]
ignore_missing_imports = true
